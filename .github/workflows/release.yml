# Runs on main only. Re-runs the CI gates, then publishes the image by digest,
# signs it keylessly with the workflow's OIDC identity, attaches a CycloneDX
# SBOM attestation, and proves the result in a throwaway cluster: Kyverno must
# admit the signed digest and refuse everything else, Argo CD must deploy it,
# and Tetragon must report a sensitive file read.
#
# Keyless signing records the certificate in the public Rekor transparency log.
# The certificate names this repository, this workflow and the commit SHA.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # Sigstore keyless signing
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      SIGNER: https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/heads/main
      ISSUER: https://token.actions.githubusercontent.com
      TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          build-args: VERSION=${{ github.sha }}
          # One plain image manifest; signature and SBOM are attached by cosign below.
          provenance: false
          sbom: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: sign (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: sbom.cdx.json
      - name: attest SBOM
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$IMAGE@$DIGEST"
      - name: verify signature and attestation
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify --certificate-identity "$SIGNER" --certificate-oidc-issuer "$ISSUER" "$IMAGE@$DIGEST" > /dev/null
          cosign verify-attestation --type cyclonedx \
            --certificate-identity "$SIGNER" --certificate-oidc-issuer "$ISSUER" "$IMAGE@$DIGEST" > /dev/null
          echo "signature and SBOM attestation verified for $IMAGE@$DIGEST"
      - name: scan the SBOM (trivy sbom)
        run: |
          docker run --rm -v "$PWD:/src" "$TRIVY_IMAGE" sbom \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 /src/sbom.cdx.json

  e2e:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # pushes the deliberately unsigned test image
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
      BUSYBOX: busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: kind cluster (no default CNI)
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          config: deploy/cluster/kind.yaml
          cluster_name: e2e
          wait: 0s

      - name: install Cilium (CNI) and Tetragon
        run: |
          helm repo add cilium https://helm.cilium.io
          helm install cilium cilium/cilium --version 1.20.2 -n kube-system \
            --set image.pullPolicy=IfNotPresent --set ipam.mode=kubernetes --set operator.replicas=1 --wait
          kubectl wait --for=condition=Ready nodes --all --timeout=180s
          helm install tetragon cilium/tetragon --version 1.7.1 -n kube-system --wait
          kubectl wait --for=condition=Established crd/tracingpolicies.cilium.io --timeout=120s
          kubectl apply -f policies/tetragon/
          # kubectl apply succeeds even when the agent rejects the policy, so
          # ask the agent itself whether it loaded.
          for _ in $(seq 24); do
            tps=$(kubectl -n kube-system exec ds/tetragon -c tetragon -- tetra tracingpolicy list 2>&1 || true)
            if grep -q 'sensitive-file-read.*enabled' <<<"$tps"; then break; fi
            sleep 5
          done
          echo "$tps"
          grep -q 'sensitive-file-read.*enabled' <<<"$tps"

      - name: install Kyverno and supply-chain policies
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm repo add kyverno https://kyverno.github.io/kyverno/
          helm install kyverno kyverno/kyverno --version 3.9.1 -n kyverno --create-namespace --wait
          kubectl apply -f deploy/cluster/namespaces.yaml
          for ns in kyverno demo; do
            kubectl -n "$ns" create secret docker-registry ghcr-pull \
              --docker-server=ghcr.io --docker-username="$GHCR_USER" --docker-password="$GHCR_TOKEN"
          done
          kubectl apply -f policies/kyverno/

      - name: push a deliberately unsigned image
        id: unsigned
        run: |
          docker pull "$BUSYBOX"
          docker tag "$BUSYBOX" "$IMAGE:e2e-unsigned"
          docker push "$IMAGE:e2e-unsigned"
          digest=$(docker buildx imagetools inspect "$IMAGE:e2e-unsigned" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: admission tests
        env:
          UNSIGNED_DIGEST: ${{ steps.unsigned.outputs.digest }}
        run: scripts/e2e-admission.sh

      - name: deploy with Argo CD
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm
          helm install argocd argo/argo-cd --version 10.9.6 -n argocd --create-namespace \
            --set dex.enabled=false --set notifications.enabled=false --wait
          envsubst < deploy/argocd/repository.yaml.tmpl | kubectl apply -f -
          envsubst < deploy/argocd/application.yaml.tmpl | kubectl apply -f -
          for _ in $(seq 60); do
            state=$(kubectl -n argocd get application devsecops-demo \
              -o jsonpath='{.status.sync.status}/{.status.health.status}' 2>/dev/null || true)
            echo "argo cd: ${state:-pending}"
            [ "$state" = "Synced/Healthy" ] && break
            sleep 5
          done
          [ "$state" = "Synced/Healthy" ]
          kubectl -n demo rollout status deploy/devsecops-demo --timeout=120s

      - name: smoke test the deployed digest
        run: |
          running=$(kubectl -n demo get pods -l app.kubernetes.io/name=devsecops-demo \
            -o jsonpath='{.items[0].status.containerStatuses[0].imageID}')
          echo "running: $running"
          case "$running" in *"$IMAGE_DIGEST") ;; *) echo "unexpected image"; exit 1 ;; esac
          kubectl -n demo port-forward svc/devsecops-demo 8080:80 >/dev/null 2>&1 &
          sleep 3
          body=$(curl -fsS http://127.0.0.1:8080/)
          echo "$body"
          echo "$body" | grep -q "\"version\":\"$GITHUB_SHA\""

      - name: runtime detection (Tetragon)
        run: |
          kubectl create namespace tetragon-test
          kubectl get tracingpolicies
          # Wait before touching the file, then keep touching it: a read in the
          # first instant of a container can land before Tetragon has mapped
          # the process to its pod, and the event then carries no pod.
          kubectl -n tetragon-test run intruder --image="$BUSYBOX" --restart=Never \
            --command -- sh -c 'sleep 10; echo x >> /etc/shadow; while true; do cat /etc/shadow > /dev/null; sleep 2; done'
          kubectl -n tetragon-test wait --for=condition=Ready pod/intruder --timeout=120s
          match='fromjson? | select(.process_kprobe != null)
            | select(.process_kprobe.process.pod.namespace == "tetragon-test")
            | select(any(.process_kprobe.args[]?; (.file_arg.path // "") | startswith("/etc/shadow")))'
          for _ in $(seq 30); do
            hit=$(kubectl -n kube-system logs ds/tetragon -c export-stdout --tail=-1 \
              | jq -Rc "$match | {pod: .process_kprobe.process.pod.name, binary: .process_kprobe.process.binary, function: .process_kprobe.function_name, path: .process_kprobe.args[0].file_arg.path}" \
              | head -1)
            if [ -n "$hit" ]; then
              echo "Tetragon reported: $hit"
              exit 0
            fi
            sleep 5
          done
          echo "no Tetragon event for /etc/shadow"
          echo "--- process_kprobe events seen (last 5):"
          kubectl -n kube-system logs ds/tetragon -c export-stdout --tail=-1 | grep '"process_kprobe"' | tail -5 || true
          echo "--- tracing policies:"
          kubectl get tracingpolicies -o yaml || true
          echo "--- tetragon agent log:"
          kubectl -n kube-system logs ds/tetragon -c tetragon --tail=50 || true
          exit 1

      - name: diagnostics
        if: failure()
        run: |
          kubectl get pods -A || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -50 || true
          kubectl -n argocd get application devsecops-demo -o yaml || true
          kubectl -n kyverno logs deploy/kyverno-admission-controller --tail=100 || true
