# Default deny for the namespace, then allow only HTTP into the service from
# inside the namespace. The service makes no outbound calls, so egress stays denied.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-default-deny
  labels:
    {{- include "devsecops-demo.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-allow-http
  labels:
    {{- include "devsecops-demo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "devsecops-demo.selector" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: 8080
          protocol: TCP
