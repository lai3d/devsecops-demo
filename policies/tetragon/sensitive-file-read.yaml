# Report any process that reads or writes credential files inside containers.
# Follows examples/tracingpolicy/filename_monitoring_filtered.yaml in Tetragon v1.7.1.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: sensitive-file-read
spec:
  kprobes:
    - call: "security_file_permission"
      syscall: false
      return: true
      args:
        - index: 0
          type: "file" # struct file *, resolved to a path
        - index: 1
          type: "int" # MAY_READ 0x04, MAY_WRITE 0x02
      returnArg:
        index: 0
        type: "int"
      selectors:
        - matchArgs:
            - index: 0
              operator: "Prefix"
              values:
                - "/etc/shadow"
                - "/etc/sudoers"
                - "/root/.ssh"
